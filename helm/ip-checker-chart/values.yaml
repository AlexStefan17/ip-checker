namespace: ip-checker

ipChecker:
  image: ip-checker-image
  tag: latest
  replicaCount: 1
  env:
    FLASK_PORT: "5000"
    IP_API_URL: "http://ip-api.com/json/{}"
    LOG_LEVEL: "INFO"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    CACHE_TTL: "3600"
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: ip-backup
    BACKUP_INTERVAL: "300"

redis:
  image: redis
  tag: latest
  replicaCount: 1

minio:
  image: minio/minio
  tag: latest
  replicaCount: 1
  storage: 10Gi
  accessKey: minioadmin
  secretKey: minioadmin