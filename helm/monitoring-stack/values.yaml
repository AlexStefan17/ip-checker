global:
  ipCheckerMetricsEnabled: true
  ipCheckerMetricsTargets:
    - ip-checker.ip-checker.svc.cluster.local:80

prometheus:
  image:
    repository: prom/prometheus
    tag: v2.53.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 9090
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  config:
    scrapeInterval: 15s
    evaluationInterval: 15s

grafana:
  image:
    repository: grafana/grafana
    tag: 11.1.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  adminUser: admin
  adminPassword: admin
  env:
    GF_USERS_DEFAULT_THEME: dark
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  ingress:
    enabled: true
    ingressClassName: nginx
    host: grafana.ip-checker.local
    path: /
    pathType: Prefix
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

loki:
  image:
    repository: grafana/loki
    tag: 3.1.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3100
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: "100m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

promtail:
  image:
    repository: grafana/promtail
    tag: 3.1.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
