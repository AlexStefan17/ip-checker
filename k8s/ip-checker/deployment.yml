apiVersion: apps/v1
kind: Deployment
metadata:
  name: ip-checker
  namespace: ip-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ip-checker
  template:
    metadata:
      labels:
        app: ip-checker
    spec:
      containers:
        - name: ip-checker
          image: ip-checker-image:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_PORT
              value: "5000"
            - name: IP_API_URL
              value: "http://ip-api.com/json/{}"
            - name: LOG_LEVEL
              value: "INFO"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
            - name: CACHE_TTL
              value: "3600"
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: MINIO_BUCKET
              value: "ip-backup"
            - name: BACKUP_INTERVAL
              value: "300"