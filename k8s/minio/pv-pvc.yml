apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-pv
  namespace: ip-checker
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: ip-checker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi